# 股票平台 - 生产环境 Docker Compose
# 使用: docker compose up -d

version: '3.8'

services:
  # ==================== 后端 API ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-platform-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/app.db}
      - REMOTE_DATA_SERVICE_URL=http://data-service:5002
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - stock-data:/app/data
      - ./backend/logs:/app/logs
    expose:
      - "8000"
    depends_on:
      data-service:
        condition: service_started
    networks:
      - stock-platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==================== 前端 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-platform-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stock-platform-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==================== 数据服务 ====================
  data-service:
    build:
      context: ./back_test_data_service
      dockerfile: Dockerfile
    container_name: stock-platform-data
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_MODE=${DATA_SERVICE_MODE:-api}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - stock-data:/app/data
      - ./back_test_data_service/logs:/app/logs
    expose:
      - "5002"
    networks:
      - stock-platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==================== Nginx 反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: stock-platform-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - stock-platform-net

networks:
  stock-platform-net:
    driver: bridge

volumes:
  stock-data:
    driver: local
